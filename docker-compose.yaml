services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5011:5011"
    environment:
      - DB_URL=${DB_URL}
      - DB_SCHEMA=${DB_SCHEMA:-fastcpi}
      - XAI_API_KEY=${XAI_API_KEY}
      - XAI_BASE_URL=${XAI_BASE_URL}
      - GROK_MODEL=${GROK_MODEL}
      - EXA_API_KEY=${EXA_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - APP_SECRET=${APP_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://cpi.fastsme.com/auth/google/callback}
      - GOOGLE_ALLOWED_DOMAINS=${GOOGLE_ALLOWED_DOMAINS}
      - GOOGLE_ALLOWED_EMAILS=${GOOGLE_ALLOWED_EMAILS}
      - POSTMARK_API_TOKEN=${POSTMARK_API_TOKEN}
      - FROM_EMAIL=${FROM_EMAIL}
      - FROM_NAME=${FROM_NAME}
      - TO_EMAIL=${TO_EMAIL}
      - LOGIN=${LOGIN}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://cpi.fastsme.com}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - WATCHLIST_SCANS_ENABLED=0
      - WATCHLIST_SCAN_INTERVAL_SECONDS=${WATCHLIST_SCAN_INTERVAL_SECONDS:-60}
      - DAILY_OBSERVATION_JOB_QUOTA=${DAILY_OBSERVATION_JOB_QUOTA:-25}
      - DAILY_EXA_SEARCH_QUOTA=${DAILY_EXA_SEARCH_QUOTA:-100}
      - DAILY_PAGE_FETCH_QUOTA=${DAILY_PAGE_FETCH_QUOTA:-1000}
      - DOMAIN_FETCHES_PER_MINUTE=${DOMAIN_FETCHES_PER_MINUTE:-30}
      - PORT=${PORT}
    labels:
      - coolify.managed=true
      - coolify.port=5011
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5011/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.watchlist_worker"]
    environment:
      - DB_URL=${DB_URL}
      - DB_SCHEMA=${DB_SCHEMA:-fastcpi}
      - EXA_API_KEY=${EXA_API_KEY}
      - POSTMARK_API_TOKEN=${POSTMARK_API_TOKEN}
      - FROM_EMAIL=${FROM_EMAIL}
      - FROM_NAME=${FROM_NAME}
      - DAILY_EXA_SEARCH_QUOTA=${DAILY_EXA_SEARCH_QUOTA:-100}
      - DAILY_PAGE_FETCH_QUOTA=${DAILY_PAGE_FETCH_QUOTA:-1000}
      - DOMAIN_FETCHES_PER_MINUTE=${DOMAIN_FETCHES_PER_MINUTE:-30}
      - WATCHLIST_SCAN_INTERVAL_SECONDS=${WATCHLIST_SCAN_INTERVAL_SECONDS:-60}
    restart: unless-stopped
